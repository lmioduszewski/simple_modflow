[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myflopy"
version = "0.1.0"
description = "modflow helper package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Luke Mioduszewski", email="luke.mioduszewski@gmail.com" }
]
# NOTE: the MODFLOW 6 / MODPATH / Triangle / PEST++ executables are runtime
# BINARIES, not pip dependencies — install them on PATH separately (e.g.
# `python -m flopy.utils.get_modflow` for the MODFLOW family; PEST++ from its
# GitHub releases). GDAL/OSGeo is likewise a system library (no reliable pip
# wheel), needed only by the geotiff contour exporter.
dependencies = [
  "flopy>=3.10,<4",
  "geopandas>=0.14",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "Pillow>=10.0",
  "plotly>=5.0",
  "rasterio>=1.3",
  "requests>=2.31",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "seaborn>=0.13",
  "shapely>=2.0",
]

[project.optional-dependencies]
viz = [
  "dash>=2.15",
  "dash-bootstrap-components>=1.5",
]
viz3d = [
  "pyvista>=0.48",
  "trame>=3.0",
  "trame-vtk>=2.0",
  "trame-vuetify>=3.0",
]
dev = [
  "mypy>=1.10",
  "nbstripout>=0.7",
  "pytest>=8.0",
  "ruff>=0.5",
]
parallel = [
  "h5py>=3.10",
  "pymetis>=2023.1",
  "scikit-learn>=1.3",
]
# PEST/PEST++ calibration workflow. Installs the pyEMU Python toolkit; the
# PEST++ executables themselves (pestpp-ies, pestpp-glm, ...) are separate
# binaries and must be installed on PATH independently (they are not on PyPI).
pest = [
  "pyemu>=1.3",
]
# Unstructured-grid xarray interchange (VoronoiGridPlus.to_xugrid / NetCDF).
xugrid = [
  "xugrid>=0.9",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
myflopy = ["py.typed", "**/*.pyi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = [
  "*.aux.xml",
  "*.csv",
  "*.dbc",
  "*.dbf",
  "*.edge",
  "*.ele",
  "*.gpkg",
  "*.grb",
  "*.hds",
  "*.ipynb",
  "*.log",
  "*.neigh",
  "*.node",
  "*.pdf",
  "*.png",
  "*.poly",
  "*.prj",
  "*.shp",
  "*.shx",
  "*.svg",
  "*.tif",
  "*.xlsx",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["attic", "examples", "scripts", "src/myflopy/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Legacy burn-down list (implementation plan 1.4 triage, 2026-07-16): these
# counts may only go DOWN; remove a code from this list once its violations
# are fixed. E501=646 (line length), F841=18 (unused vars — unsafe to
# autofix), E722=12 (bare excepts — Phase 7.3 narrows these), B008=9,
# B018=8, B023=4.
ignore = ["E501", "F841", "E722", "B008", "B018", "B023"]

[tool.ruff.lint.per-file-ignores]
# Lazy-export tables: the TYPE_CHECKING import blocks exist purely for IDE
# visibility of the exported names (mirrors of _EXPORTS).
"src/myflopy/__init__.py" = ["F401", "E402"]
"src/myflopy/modflow/mf6/__init__.py" = ["F401", "E402"]
# Phase-2 attic candidates (implementation plan 2.1) — not worth fixing.
"src/myflopy/modflow/mf6/mf3dplots.py" = ["F821"]
"src/myflopy/modflow/mf6/mf2Dplots.py" = ["F403", "F405"]
"src/myflopy/modflow/calcs/cj_approximation.py" = ["F821"]
"src/myflopy/modflow/mf6/grasspyV.py" = ["F821", "E402"]
"src/myflopy/modflow/gwt/gwt.py" = ["F821", "E402"]
# Tests set MPLBACKEND/sys.path before imports by design.
"tests/*" = ["E402"]

# Scoped type check (implementation plan 1.4): the declarative core only.
# `python -m mypy` with no args checks exactly these files. Grow the list as
# modules gain annotations; never shrink it.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
# Scoped check: third-party packages are treated as untyped (Any) — some
# installed libs use syntax newer than the 3.10 grammar pin and must not be
# parsed at all.
no_site_packages = true
files = [
  "src/myflopy/specs.py",
  "src/myflopy/package_api.py",
  "src/myflopy/sources.py",
  "src/myflopy/workspace.py",
  "src/myflopy/advanced.py",
  "src/myflopy/builders.py",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "canonical: integration test that must use the authoritative canonical model",
  "unit: intentionally isolated small-fixture test that does not claim canonical coverage",
  "slow: test that shells out to a MODFLOW 6 / MODPATH binary or runs a PEST build (deselect with -m 'not slow')",
]

