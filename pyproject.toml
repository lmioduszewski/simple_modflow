[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myflopy"
version = "0.1.0"
description = "modflow helper package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Luke Mioduszewski", email="luke.mioduszewski@gmail.com" }
]
# NOTE: the MODFLOW 6 / MODPATH / Triangle / PEST++ executables are runtime
# BINARIES, not pip dependencies — install them on PATH separately (e.g.
# `python -m flopy.utils.get_modflow` for the MODFLOW family; PEST++ from its
# GitHub releases). GDAL/OSGeo is likewise a system library (no reliable pip
# wheel), needed only by the geotiff contour exporter.
dependencies = [
  "flopy>=3.10,<4",
  "geopandas>=0.14",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "Pillow>=10.0",
  "plotly>=5.0",
  "rasterio>=1.3",
  "requests>=2.31",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "seaborn>=0.13",
  "shapely>=2.0",
]

[project.optional-dependencies]
viz = [
  "dash>=2.15",
  "dash-bootstrap-components>=1.5",
]
viz3d = [
  "pyvista>=0.48",
  "trame>=3.0",
  "trame-vtk>=2.0",
  "trame-vuetify>=3.0",
]
dev = [
  "nbstripout>=0.7",
  "pytest>=8.0",
  "ruff>=0.5",
]
parallel = [
  "h5py>=3.10",
  "pymetis>=2023.1",
  "scikit-learn>=1.3",
]
# PEST/PEST++ calibration workflow. Installs the pyEMU Python toolkit; the
# PEST++ executables themselves (pestpp-ies, pestpp-glm, ...) are separate
# binaries and must be installed on PATH independently (they are not on PyPI).
pest = [
  "pyemu>=1.3",
]
# Unstructured-grid xarray interchange (VoronoiGridPlus.to_xugrid / NetCDF).
xugrid = [
  "xugrid>=0.9",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
myflopy = ["py.typed", "**/*.pyi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = [
  "*.aux.xml",
  "*.csv",
  "*.dbc",
  "*.dbf",
  "*.edge",
  "*.ele",
  "*.gpkg",
  "*.grb",
  "*.hds",
  "*.ipynb",
  "*.log",
  "*.neigh",
  "*.node",
  "*.pdf",
  "*.png",
  "*.poly",
  "*.prj",
  "*.shp",
  "*.shx",
  "*.svg",
  "*.tif",
  "*.xlsx",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["attic", "examples", "scripts", "src/myflopy/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "canonical: integration test that must use the authoritative canonical model",
  "unit: intentionally isolated small-fixture test that does not claim canonical coverage",
  "slow: test that shells out to a MODFLOW 6 / MODPATH binary or runs a PEST build (deselect with -m 'not slow')",
]

