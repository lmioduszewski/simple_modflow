[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myflopy"
version = "0.1.0"
description = "modflow helper package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Luke Mioduszewski", email="luke.mioduszewski@gmail.com" }
]
dependencies = [
  "flopy>=3.10,<4",
  "geopandas>=0.14",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "plotly>=5.0",
  "rasterio>=1.3",
  "requests>=2.31",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "shapely>=2.0",
]

[project.optional-dependencies]
viz = [
  "dash>=2.15",
  "dash-bootstrap-components>=1.5",
]
viz3d = [
  "pyvista>=0.48",
  "trame>=3.0",
  "trame-vtk>=2.0",
  "trame-vuetify>=3.0",
]
dev = [
  "pytest>=8.0",
]
parallel = [
  "h5py>=3.10",
  "pymetis>=2023.1",
  "scikit-learn>=1.3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
myflopy = ["py.typed", "**/*.pyi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = [
  "*.aux.xml",
  "*.csv",
  "*.dbc",
  "*.dbf",
  "*.edge",
  "*.ele",
  "*.gpkg",
  "*.grb",
  "*.hds",
  "*.ipynb",
  "*.log",
  "*.neigh",
  "*.node",
  "*.pdf",
  "*.png",
  "*.poly",
  "*.prj",
  "*.shp",
  "*.shx",
  "*.svg",
  "*.tif",
  "*.xlsx",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "canonical: integration test that must use the authoritative canonical model",
  "unit: intentionally isolated small-fixture test that does not claim canonical coverage",
  "slow: test that shells out to a MODFLOW 6 / MODPATH binary or runs a PEST build (deselect with -m 'not slow')",
]

