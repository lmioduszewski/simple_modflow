name: CI

on:
  push:
    branches: [main, myflopy]
  pull_request:

jobs:
  test:
    name: fast tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev tools
        run: python -m pip install -e .[dev]
      - name: Import-surface smoke
        # Resolves every lazy export; exercises the vendored-figs fallback
        # (no external figs exists in CI — the permanent drift alarm).
        run: python -c "import myflopy; [getattr(myflopy, n) for n in myflopy.__all__]; import myflopy.viz; print('ok')"
      - name: Install triangle + mf6 binaries
        # Fast tests BUILD models (flopy validates exe paths) and generate
        # Voronoi meshes, but never RUN models — that is the `slow` contract.
        shell: bash
        run: |
          bindir="$HOME/.local/bin"
          mkdir -p "$bindir"
          python -m flopy.utils.get_modflow --subset mf6,triangle "$bindir"
          # GITHUB_PATH entries are consumed by native (Windows) processes:
          # convert Git-Bash's POSIX path to a Windows path where applicable.
          if command -v cygpath >/dev/null 2>&1; then bindir=$(cygpath -w "$bindir"); fi
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Fast test suite
        # -ra --tb=line: end the log with a compact failure summary so a
        # glance at the tail explains a red job.
        run: python -m pytest -m "not slow" -q -ra --tb=line

  lint:
    name: ruff + scoped mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev tools
        run: python -m pip install -e .[dev]
      - name: Ruff
        run: python -m ruff check src tests
      - name: Scoped mypy (declarative core)
        run: python -m mypy

  wheel:
    name: wheel build + vendored-figs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel in a clean venv and smoke it
        # Verifies myflopy._vendor.figs lands in the wheel (plan 1.1
        # acceptance) and the viz front door works without local figs.
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "
          import myflopy
          [getattr(myflopy, n) for n in myflopy.__all__]
          from myflopy import viz
          assert viz.Fig.__module__.startswith('myflopy._vendor.figs'), viz.Fig.__module__
          fig = viz.Fig()
          assert hasattr(fig, 'add_post_script')
          print('wheel ok:', myflopy.__file__)
          "
