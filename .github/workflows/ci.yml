name: CI

on:
  push:
    branches: [main, myflopy]
  pull_request:

jobs:
  test:
    name: fast tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev tools
        run: python -m pip install -e .[dev]
      - name: Import-surface smoke
        # Resolves every lazy export; exercises the vendored-figs fallback
        # (no external figs exists in CI — the permanent drift alarm).
        run: python -c "import myflopy; [getattr(myflopy, n) for n in myflopy.__all__]; import myflopy.viz; print('ok')"
      - name: Fast test suite
        # The fast suite must not need MF6 binaries (the `slow` contract).
        run: python -m pytest -m "not slow" -q

  lint:
    name: ruff + scoped mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev tools
        run: python -m pip install -e .[dev]
      - name: Ruff
        run: python -m ruff check src tests
      - name: Scoped mypy (declarative core)
        run: python -m mypy

  wheel:
    name: wheel build + vendored-figs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel in a clean venv and smoke it
        # Verifies myflopy._vendor.figs lands in the wheel (plan 1.1
        # acceptance) and the viz front door works without local figs.
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "
          import myflopy
          [getattr(myflopy, n) for n in myflopy.__all__]
          from myflopy import viz
          assert viz.Fig.__module__.startswith('myflopy._vendor.figs'), viz.Fig.__module__
          fig = viz.Fig()
          assert hasattr(fig, 'add_post_script')
          print('wheel ok:', myflopy.__file__)
          "
